<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arbitrage Opportunities</title>
</head>
<body>
    <h1>Arbitrage Opportunities</h1>
    <table border="1">
        <tr>
            <th>Timestamp</th>
            <th>Symbol</th>
            <th>Price Difference (%)</th>
            <th>Details</th>
            <th>Opportunity</th>
        </tr>
        {% for item in data %}
        <tr>
            <td>{{ item.timestamp }}</td>
            <td>{{ item.symbol }}</td>
            <td>{{ item.price_difference | round(2) }}</td>
            <td>{{ item.prices }}</td>
            <td>{{ item.arbitrage_opportunity }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
